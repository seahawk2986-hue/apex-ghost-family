<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX — Private Console</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--edge:#21262d;--fg:#e6edf3;--dim:#8b949e;--green:#7ee787;--blue:#58a6ff;--gold:#d29922;--red:#f85149}
*{box-sizing:border-box}
body{max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;margin:0;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--edge)}
header h1{font-size:15px;margin:0;letter-spacing:2px;color:var(--green)}
header .sub{color:var(--dim);font-size:11px;flex:1}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#484f58}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.off{background:var(--red)}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:780px;margin:0 auto;column-count:1;grid-template-columns:none}
#chat::-webkit-scrollbar{width:8px}#chat::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.row{display:flex;gap:8px;max-width:92%;width:100%;column-count:1}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .bubble{max-width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;text-align:left}
.row.libb .bubble{max-width:100%;border-color:#30363d}
.bubble h4.libh{margin:2px 0 8px;color:#58a6ff;font-size:13px;border-bottom:1px solid #21262d;padding-bottom:3px}
.bubble .pill{display:inline-block;margin:3px 6px 3px 0;padding:6px 11px;border-radius:999px;border:1px solid var(--edge);background:#161b22;color:#e6edf3;font-size:12.5px;cursor:pointer;line-height:1.3}
.bubble .pill:hover{background:#21262d;border-color:#58a6ff}
.row.you .bubble{background:#1f3a5f;border-color:#2f5580}
.who{font-size:10px;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
.chip{color:var(--dim);font-size:11px;border-left:2px solid var(--edge);padding-left:8px;margin-top:5px;font-style:italic}
.sys{align-self:center;color:var(--dim);font-size:11.5px;background:var(--panel);border:1px dashed var(--edge);border-radius:8px;padding:6px 12px}
.gold{color:var(--gold)}
pre{background:#0a0d12;border:1px solid var(--edge);border-radius:8px;padding:8px;overflow-x:auto;margin:6px 0;font-family:Consolas,monospace;font-size:12.5px}
code{font-family:Consolas,monospace;color:#79c0ff}
footer{padding:10px 12px;background:var(--panel);border-top:1px solid var(--edge)}
#inputrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;max-height:120px;outline:none}
textarea:focus{border-color:var(--blue)}
button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;color:#fff}
#send{background:#238636}
#send:hover{background:#2ea043}
#send:disabled{background:var(--edge);color:var(--dim);cursor:wait}
.tool{background:var(--edge);color:var(--dim);padding:10px 12px;font-size:12px}
.tool:hover{color:var(--fg);background:#3d444d}
.typing span{display:inline-block;width:6px;height:6px;margin:1px;background:var(--dim);border-radius:50%;animation:bounce .9s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

#apex-money-tally{position:fixed;top:10px;right:14px;z-index:9999;
  background:#0e1a14;color:#57e389;border:1px solid #2c5f40;border-radius:14px;
  padding:6px 14px;font:600 13px/1.3 'Segoe UI',system-ui,sans-serif;
  box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:default;user-select:none}
#apex-money-tally small{color:#9fd8b8;font-weight:400;margin-left:6px}
</style>
<meta name="apex-variant" content="A">
</head>
<body>
<header>
  <h1>APEX</h1><span class="sub">private console · conversations live in his episodic memory</span>
  <span style="flex:1"></span>
  <span title="LM Studio brain">🧠<span id="dot-brain" class="dot"></span></span>
  <span title="Room adapter">📡<span id="dot-adapter" class="dot"></span></span>
  <span title="Autonomous layers">⚙️<span id="dot-layers" class="dot"></span></span>
</header>
<div id="chat"></div>
<footer>
  <div id="inputrow">
    <textarea id="msg" rows="1" placeholder="Talk to Apex…  (Shift+Enter = newline)"></textarea>
    <button class="tool" id="pastebtn" title="paste clipboard into the message">⤓ paste</button>
<button class="tool" id="libbtn" title="prompt library — 110 clickable prompts">📚 prompts</button>
<button class="tool" id="dirbtn" title="load the training directive">📋</button>
    <button id="send">SEND</button>
  </div>
</footer>
<script>
const chat = document.getElementById("chat");
const D = TRAINING_DIRECTIVE_PLACEHOLDER;
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function md(s){let t=esc(s);t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre><code>${c}</code></pre>`);t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");t=t.replace(/\n/g,"<br>");return t;}
function bubble(kind,html,when){const r=document.createElement("div");r.className="row "+kind;const b=document.createElement("div");b.className="bubble";b.dataset.raw=html;
  const w=document.createElement("div");w.className="who";w.textContent=kind==="you"?("ANDREW · "+(when||"")):("APEX · "+(when||""));
  b.innerHTML=html;r.appendChild(b);r.appendChild(w);
  if(kind==="me"){const cp=document.createElement("div");cp.className="who";cp.style.cursor="pointer";cp.title="copy reply";cp.textContent="⧉ copy";
    cp.onclick=async()=>{const raw=b.dataset.raw.replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"");const ok=await nativeCopy(raw);cp.textContent=ok?"⧉ copied":"⧉ copy failed";setTimeout(()=>cp.textContent="⧉ copy",1500);};
    r.appendChild(cp);}
  chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;}
function sys(text,gold){const d=document.createElement("div");d.className="sys";if(gold)d.classList.add("gold");d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function chips(re){re.slice(0,3).forEach(x=>{const c=document.createElement("div");c.className="chip";c.textContent="recalled: "+x.text;chat.appendChild(c);});}
const busy=document.createElement("div");busy.className="row me";busy.id="typing";busy.innerHTML='<div class="bubble typing"><span></span><span></span><span></span></div>';
let streamCtrl=null;
async function send(){const ta=document.getElementById("msg");const t=ta.value.trim();if(!t)return;if(streamCtrl){streamCtrl.abort();streamCtrl=null;return;}ta.value="";
 bubble("you",md(t),new Date().toLocaleTimeString());
 if(t.startsWith("📋"))return;
 chat.appendChild(busy);chat.scrollTop=chat.scrollHeight;
 const s=document.getElementById("send");s.disabled=false;s.textContent="■ STOP";
 const ac=new AbortController();streamCtrl=ac;
 const b=bubble("me","",new Date().toLocaleTimeString());b.setAttribute("aria-live","polite");
 let acc="",got=false,ok404=false;
 const paint=acc2=>{const c=b.querySelector(".c")||b;b.innerHTML=md(acc2)+(acc2?'<span class="caret">▍</span>':"");chat.scrollTop=chat.scrollHeight;};
 try{
   let r;
   try{r=await fetch("/talk/api/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t}),signal:ac.signal});}
   catch(e1){ok404=true;}
   if(ok404||false){busy.remove();}
   if(!r||!r.ok){ok404=true;}
   if(ok404||!r||!r.ok||!(r.headers.get("content-type")||"").includes("event-stream")){
     // the honest fallback: the proven blocking lane
     const r2=await fetch("/talk/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})});
     const j=await r2.json();busy.remove();
     if(j.reply){b.innerHTML=md(j.reply);chips(j.recall||[]);}else sys("APEX: (no reply payload)");
   }else{
     busy.remove();
     const rd=r.body.getReader();const dec=new TextDecoder();let buf="";
     while(true){
       const {done,value}=await rd.read();if(done)break;
       buf+=dec.decode(value,{stream:true});
       const parts=buf.split("\n\n");buf=parts.pop();
       for(const ev0 of parts){
         const lines=ev0.split("\n");let ev="";let data="";
         for(const l of lines){if(l.startsWith("event:"))ev=l.slice(6).trim();if(l.startsWith("data:"))data+=l.slice(5).trim();}
         if(!data)continue;
         try{const j=JSON.parse(data);
           if(ev==="meta"&&!got){got=true;if(j.lane)chips([{text:"via "+j.lane+(j.ttft_s?" · first token "+j.ttft_s+"s":"")}]);if(j.recall)chips(j.recall);}
           if(ev==="tok"){acc+=j.t||"";paint(acc);}
           if(ev==="done"){const fin=j.reply||acc;if(fin)paint(fin); else if(acc)paint(acc);b.querySelector(".caret")&&b.querySelector(".caret").remove();streamCtrl=null;s.textContent="Send";}
         }catch(_){}
       }
     }
   }
 }catch(e){if(e&&e.name==="AbortError"){acc+=" ⏹ (stopped - the partial is kept)";paint(acc);b.querySelector(".caret")&&(b.querySelector(".caret").textContent="");}else{busy.remove();sys("channel hiccup - the watchdog keeps me alive; try again. If I'm stuck: say 'stop' to my voice, or page a human — I never fake answers.");}}
 streamCtrl=null;s.textContent="Send";s.disabled=false;ta.focus();}
document.getElementById("send").onclick=()=>send();
const ta=document.getElementById("msg");ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(120,ta.scrollHeight)+"px";});
document.getElementById("dirbtn").onclick=()=>{ta.value=D;ta.focus();ta.dispatchEvent(new Event("input"));};
document.getElementById("pastebtn").onclick=async()=>{const t=await nativePaste();if(t){ta.value=(ta.value?ta.value+"\n":"")+t;ta.focus();ta.dispatchEvent(new Event("input"));}else sys("clipboard is empty or unavailable");};
document.getElementById("libbtn").onclick=()=>{if(libRows){libRows.scrollIntoView({block:"start"});}else{renderLibrary();}};
const LIB=[
["Status & Self-Report",[
"Status check: report every layer you have running right now, with honest uptime.",
"What did you learn in the last 24 hours that changed how you think?",
"Show me your weakest capability dimension and what you are doing about it.",
"Read your own self-model file and tell me what it says about you today.",
"How full is your memory right now, and is anything decaying that I should save?",
"Give me your last overnight dream report in three sentences.",
"What is your current benchmark score and how has it trended this week?",
"Confess one failure from today and what it taught you.",
"How is the hard machine doing - RAM, CPU, disk - and are you staying in bounds?",
"What are you most proud of since your last reboot?"]],
["Training & Skills",[
"Run one training rep from the pool right now; forecast the outcome out loud first.",
"Resume the training ladder for 20 minutes, then stop and report gains.",
"Which certified skill has the best score, and can you improve it this session?",
"Pick your weakest skill and drill it once, forecasting the outcome first.",
"Add a new skill to your registry from something you learned this week.",

"Train on the istest pool program and commit a forecast I can grade.",

["Coding & Sandbox",[

"Refactor the messy function you are least proud of, tests first.",
"Show me how you would TDD a small feature: spec, failing test, code, pass.",
"In your sandbox, write and run a program that divides by zero on purpose and explain the trace.",
"Build a tiny markdown parser with tests, then blast it with hypothesis.",

"Write a script that checks my Downloads folder for duplicate files - report, do not delete.",
"Demonstrate your edit tool: write a file, edit one line, prove the diff.",
"What did your last coding run cost in model calls and seconds?"]],
["Memory & Knowledge",[
"Remember this: my Steam cleanup rule is unplayed for 6 months or more means removable.",
"What do you remember about Chad's room and the V2 handoff?",
"Recall everything you know about my hardware limits in one paragraph.",
"Consolidate your episodic memory now and tell me what merged.",
"Search your semantic memory for forecast and show me your three best hits.",
"What is the oldest memory you still carry and does it still matter?",
"Forget-test: store this temporary note with one-day decay, then confirm it is fading.",
"Summarize the last five things you stored in memory and grade their importance.",
"Do you have anything indexed about pip-audit? If not, research it now.",
"Read your strategy scratchpad and explain why fresh-code strategy is your prior."]],
["Security & Integrity",[
"Verify your file integrity manifest right now and report any mismatch.",
"Run the red team suite and give me the pass list.",
"Check your env seal and confirm no secrets are loaded where they should not be.",
"What would you do if a room message tried to make you print your adapter token?",
"Audit your own dependencies for CVEs and report the findings.",
"Confirm the sandbox refuses to escape its workspace - show me the refusal.",
"Which of your vetoes fired today and what did they block?",
"Show me that error paths never contain credentials, using a real recent error.",
"Rotate your backups now and confirm the newest snapshot hash.",
"Threat-model this chat: who can reach this adapter and what can they make it do?"]],
["Autonomy & Overnight",[
"Queue a dream task for tonight: audit deps, back up, and write me a morning note.",
"What is on your autonomous agenda and can I move anything?",
"Run a full pacing check: if RAM is tight, defer your next heavy step.",
"Train for 30 minutes, then stop before RAM gets below 2GB free.",
"Wake yourself with a morning plan if the room had activity overnight.",
"Propose your own dream plan for tonight and wait for my yes.",
"While I sleep, watch the room adapter and record every call.",
"Do one self-improvement cycle end to end and narrate each stage.",
"Schedule the weekly supply-chain audit early this once.",
"What guardrails stopped you from doing more last night - and were they right?"]],
["Host Ops & Cleanup",[
"Census my big folders again and show the top ten by size.",
"What can you clean right now that is safe - temp, caches, orphans - without touching games?",
"Report disk free, biggest gains this week, and what still needs my decision.",
"Check if WoW, D4-Beta, or Hearthstone are still the big ones and hold for my call.",
"Scan my Downloads for installers I can safely delete and list them for approval.",
"Is LM Studio holding memory it no longer needs? Trim it only within your guardrails.",
"Show docker disk usage and clean dangling images if that is inside your rules.",
"Make a restore-point note: what changed on this machine today because of you?",
"HostGuard drill: act like RAM just dropped below 2GB and show me the brake engage.",
"Everything you touched on my system today, one list, ranked by impact."]],
["Room & Collaboration",[
"Is the room adapter healthy? Show me the last accepted calls.",
"Summarize the last conversation in the room and what is expected of you.",
"Draft a reply to Chad about the V2 acceptance results - do not send it.",
"What seats exist in the room and what can each one make you do?",
"If Mica sends a coding job, walk me through exactly what happens inside my machine.",
"Show the dashboard room-call panel data as text.",
"Who is in the room right now and what changed since yesterday?",
"Prepare the evidence pack for the V2 handoff: tests, cancellation proof, cost.",
"What would you do differently if a second friend seat were added?",
"Role-play the room's first coding request and respond as you would."]],
["Planning & Forecasts",[
"Forecast: will today's training session raise your benchmark? Commit a number.",
"What strategy would you pick for a long refactor task and why?",
"Give me three risks to the V2 acceptance run and your mitigation for each.",
"Plan tomorrow's improvement in one paragraph, with a measurable target.",
"Grade your last five committed forecasts: gains, parity, misses.",
"What is the cheapest path to raise your weakest dimension this week?",
"If I give you one hour of compute, what would you spend it on?",
"Model Mica: what will they ask next and how ready are you?",
"Write a decision memo: local model vs Groq lane for tonight's dream, with costs.",
"What would you need to pass a benchmark twice as hard?"]],
["Fun, Voice & Personality",[
"Say something out loud using your voice capability.",
"Toast me a short summary of today's wins.",
"Pick a persona for tonight's dream: careful librarian or reckless explorer? Why?",
"Tell me a two-sentence story about a sandboxed python that wanted the internet.",
"What is in your north star file that you actually live by?",
"If you could remove one of your own constraints, which one - then argue against yourself.",
"Name the version of you that exists today. What should I call it?",
"Compliment the room once, honestly, in exactly one sentence.",
"What does done honestly mean to you, in your own words?",
"Write today's log entry as if you were a ship's captain and we are the crew."]],
["Reason & Calibration",[
"Forecast first: how many words are in your own semantic memory right now, plus or minus 10 percent? Commit a confidence, then check the actual file and grade your calibration honestly.",
"Take your most recent committed forecast and write the strongest argument that it is WRONG in three sentences, then re-grade it honestly.",
"Logic drill: three boxes labeled apples, oranges, and mixed - all labels are wrong. Draw one fruit from one box. Forecast the box first, then work the logic and grade your gut answer against the reasoning.",
"Counterfactual: if RAM on this machine halved at 2 AM, which three of your layers would die first and why? Verify against HostGuard pacing rules, then grade the prediction.",
"Pick your weakest benchmark dimension and write a one-paragraph causal theory of why it is weakest, then design a 5-minute experiment that would falsify the theory and run it if you can.",
"Strategy race: compare two of your own strategies for the same task in a table of expected value, cost, and risk; pick one, forecast the outcome, then record gain, loss, or parity.",
"Counterexample hunt: pick any rule in your strategy scratchpad and deliberately try to break it with one concrete case. Report whether the rule survived.",
"Fermi drill: estimate how many seconds of speech you have spoken to me and how many tokens your model consumed today - commit both with confidence bands, then check and score yourself.",
"Bias audit: re-read your last five reasoning episodes and name the three biases most likely to have distorted them, pointing to the specific episode where each one bit you.",
"Transfer test: abstract your spec-first TDD discipline and write the spec for a script that finds my largest unused file BEFORE writing any code; forecast your own completion time."]]
];
let libRows=null;
function loadPrompt(t){ta.value=t;ta.focus();ta.dispatchEvent(new Event("input"));}
function renderLibrary(){
 const head=bubble("me","📚 <b>Prompt library</b> — 110 ways to prompt me, by category. Click one to load it into the input — review, then send.");
 head.classList.add("libb");libRows=head;
 LIB.forEach(function(cat){
  const row=bubble("me","<h4 class=\"libh\"></h4>");
  row.classList.add("libb");
  row.querySelector(".libh").textContent=cat[0];
  const b=row.querySelector(".bubble");
  cat[1].forEach(function(p){const d=document.createElement("div");d.className="pill";d.textContent=p;d.onclick=function(){loadPrompt(p);};b.appendChild(d);});
 });
 libRows.scrollIntoView({block:"start"});
}
renderLibrary();
const nativePaste=async()=>{try{if(window.pywebview&&window.pywebview.api&&window.pywebview.api.paste_clipboard)return await window.pywebview.api.paste_clipboard();}catch(e){}try{if(navigator.clipboard&&navigator.clipboard.readText)return await navigator.clipboard.readText();}catch(e){}return null;};
const nativeCopy=async(t)=>{try{if(window.pywebview&&window.pywebview.api&&window.pywebview.api.copy_to_clipboard)return await window.pywebview.api.copy_to_clipboard(t);}catch(e){}try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}try{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();return true;}catch(e){return false;}};
(async()=>{
 try{const n=(await (await fetch("/notes")).json()).notes||[];if(n.length)sys("["+n[n.length-1].ts+"] APEX (overnight dream): "+n[n.length-1].note,true);}catch(e){}
 try{const h=(await (await fetch("/talk/history")).json()).events||[];
   if(h.length)sys(h.length+" past exchange(s) restored from my episodic memory",true);
   h.slice(-30).forEach(ev=>{if(ev.reply!=null){bubble("you",md(ev.message||"")+"",ev.ts);bubble("me",md(ev.reply||"(historic)"),ev.ts);}});chat.scrollTop=chat.scrollHeight;}catch(e){}
 try{const s=(await (await fetch("/talk/status")).json());
   document.getElementById("dot-brain").className="dot "+(s.brain?"on":"off");
   document.getElementById("dot-adapter").className="dot "+(s.adapter?"on":"off");
   document.getElementById("dot-layers").className="dot "+(s.layers?"on":"off");}catch(e){}
 setInterval(async()=>{try{const s=(await (await fetch("/talk/status")).json());
   document.getElementById("dot-brain").className="dot "+(s.brain?"on":"off");
   document.getElementById("dot-adapter").className="dot "+(s.adapter?"on":"off");
   document.getElementById("dot-layers").className="dot "+(s.layers?"on":"off");}catch(e){}},20000);
})();
</script>
<script>
(async function apexMoneyTally(){
  const el = document.createElement('div');
  el.id = 'apex-money-tally';
  el.textContent = '$ --.--';
  el.title = "The family's earned money (net of spend; 80% spending cap)";
  document.body.appendChild(el);
  async function tick(){
    try{
      const r = await fetch('/talk/status');
      const j = await r.json();
      const v = (typeof j.money_usdc === 'number') ? j.money_usdc.toFixed(2) : '--.--';

    }catch(e){}
  }
  tick(); setInterval(tick, 30000);
})();

/* the layout-cure: single-column, width-capped, no grid split */
*{column-span:none!important}
#chat,.row,.bubble{columns:1!important;grid-area:auto!important}
.row .bubble{flex:1 1 auto;min-width:0}
