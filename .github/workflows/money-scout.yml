name: money-scout
on:
  push:
    paths: [".github/workflows/money-scout.yml", "Tools/money_scout.py"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Tools/money_scout.py
      - name: commit the 10 waves
        run: |
          git config user.name "ghost-outsource"
          git config user.email "actions@users.noreply.github.com"
          git add money/
          git fetch origin && git pull --rebase origin main || true
          git commit -m "money: the 10 passes [skip ci]" || echo "nothing new"
          git push || true