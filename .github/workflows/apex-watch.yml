name: ApexWatchLane
"on":
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'   # the 5-min watch (the claim-race cadence x3)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the watch beat (the claim-lens + the client-care, off-box)
        env:
          APEX_ROOT: ${{ github.workspace }}
          APEX_ADAPTER: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Scripts/PrWatch.py || true
          python3 Scripts/ClaimCheck.py || true
      - name: "the meta-loop's actions lane (runner=actions - the free work)"
        env:
          APEX_ROOT: ${{ github.workspace }}
          APEX_RUNNER: actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Scripts/Apex10Loop.py || true
      - name: the watch-grain returns (the sync home)
        run: |
          git config user.name "apex-watch-lane"
          git config user.email "actions@github.com"
          git pull --rebase || git rebase --abort || true
          git add -A Config/ 2>/dev/null || true
          git commit -m "the watch-lane grain (off-box cadence)" || true
          git push || true
      - name: the artifacts home
        uses: actions/upload-artifact@v4
        with:
          name: apex-watch-harvest
          path: |
            Config/pr_watch_state.json
            Config/claimed_skips.json
            Config/papers_2026_tech10.jsonl
            Config/apex10_loop.json
          if-no-files-found: ignore