name: papers-100
on:
  push:
    paths: [".github/workflows/papers-100.yml", "Tools/papers_harvest.py"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the outsource scout (keyless, $0)
        run: python Tools/papers_harvest.py
      - name: commit the register back
        run: |
          git fetch origin
          git pull --rebase origin main || true
          git config user.name "ghost-outsource"
          git config user.email "actions@users.noreply.github.com"
          git add papers/
          git commit -m "papers-100: the register [skip ci]" || echo "nothing new"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papers-100
          path: papers/