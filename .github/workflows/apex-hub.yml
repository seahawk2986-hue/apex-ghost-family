name: ApexHubWorker
description: 'Apex Ghost Hub - off-box mining (consent-gated, packet-driven)'
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The hub's round (script-based: consent check + packet + polite mining)
        run: |
          python3 family/hub_round.py
      - name: Upload the family's harvest (the grain returns)
        uses: actions/upload-artifact@v4
        with:
          name: apex-hub-harvest
          path: |
            hub_round_result.json
            hub_packet_home.json