name: ApexHubWorker

"on":
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 h: a rotating window over the lead pool (family/hub_round.py);
                             # slower cadence keeps the hub well inside GitHub Actions terms
  workflow_dispatch:

permissions:
  contents: write   # the grain returns via commit

jobs:
  hub-round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: mining round
        run: python3 family/hub_round.py
      - name: the earn-beat (the claim-audit + the kit on GITHUB's machines)
        env:
          APEX_ROOT: ${{ github.workspace }}
          APEX_ADAPTER: ${{ github.workspace }}
        run: |
          python3 Scripts/EarnLaneMatrix.py || true
      - name: the scheduled audits (the capability rescan + the profiler on GITHUB's machines)
        env:
          APEX_ROOT: ${{ github.workspace }}
        run: |
          python3 Scripts/CapabilityRescan.py || true
          python3 Scripts/CodeProfiler.py || true
      - name: the kit/audit artifacts home
        uses: actions/upload-artifact@v4
        with:
          name: apex-hub-harvest
          path: |
            hub_round_result.json
            earn_lane_matrix.json
      - name: ship the grain home (commit the harvest to the family)
        if: always()
        run: |
          git config user.name "apex-ghost-hub"
          git config user.email "hub@apex.family"
          git add hub_round_result.json hub_packet_home.json family/
          git diff --cached --quiet || git commit -m "grain: hub harvest ${GITHUB_RUN_NUMBER} (manifest-digested) [skip ci]"
          git push
