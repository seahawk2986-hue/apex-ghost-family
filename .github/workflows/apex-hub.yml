name: ApexHubWorker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: mining round
        run: python3 family/hub_round.py
      - name: grain home
        uses: actions/upload-artifact@v4
        with:
          name: apex-hub-harvest
          path: hub_round_result.json