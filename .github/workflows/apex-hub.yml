name: ApexHubWorker

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # the grain returns via commit

jobs:
  hub-round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: mining round
        run: python3 family/hub_round.py
      - name: grain home
        uses: actions/upload-artifact@v4
        with:
          name: apex-hub-harvest
          path: hub_round_result.json
      - name: ship the grain home (commit the harvest to the family)
        if: always()
        run: |
          git config user.name "apex-ghost-hub"
          git config user.email "hub@apex.family"
          git add hub_round_result.json hub_packet_home.json family/
          git diff --cached --quiet || git commit -m "grain: hub harvest ${GITHUB_RUN_NUMBER} (manifest-digested)"
          git push
