name: sourcing-sweep
description: The 100-doc provenance round - fetching on GITHUB's silicon, near-zero local weight (per Config/outsourcing_state.json)
on:
  schedule:
    # off-phase from the family burst - shared silicon, politely spaced
    - cron: "3 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sourcing
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The sourcing sweep (their CPU, our receipts)
        run: |
          python Scripts/SourcingDesk.py --target 100 --max-fetch 90
      - name: Commit the receipts (append-only, failures visible)
        run: |
          git config user.name "apex-family"
          git config user.email "apex-family@users.noreply.github.com"
          git add Config/sourcing_ledger.jsonl Config/sourcing_state.json || true
          git diff --cached --quiet || git commit -m "sourcing receipts (runner-swept): verified n grows only on real fetches; failures stay visible"
          git push
